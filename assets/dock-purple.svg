<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <filter id="dock-glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#d000ff" flood-opacity="0.8"/>
    </filter>
  </defs>
  <!-- Outer Platform Ring -->
  <circle cx="32" cy="32" r="28" stroke="#d000ff" stroke-width="2" stroke-dasharray="6 4" opacity="0.8" filter="url(#dock-glow-purple)"/>
  <!-- Middle Ring -->
  <circle cx="32" cy="32" r="20" stroke="#f0a0ff" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.6"/>
  <!-- Inner Target Pad -->
  <circle cx="32" cy="32" r="10" fill="#d000ff" fill-opacity="0.15" stroke="#f0a0ff" stroke-width="2"/>
  <circle cx="32" cy="32" r="4" fill="#f0a0ff" opacity="0.9"/>
  <!-- Crosshairs -->
  <line x1="32" y1="6" x2="32" y2="16" stroke="#f0a0ff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="48" x2="32" y2="58" stroke="#f0a0ff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="6" y1="32" x2="16" y2="32" stroke="#f0a0ff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="48" y1="32" x2="58" y2="32" stroke="#f0a0ff" stroke-width="1.5" stroke-linecap="round"/>
</svg>
