<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#00ff88" flood-opacity="0.6"/>
    </filter>
    <linearGradient id="hull-green" x1="32" y1="4" x2="32" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a0ffb0"/>
      <stop offset="50%" stop-color="#00ff66"/>
      <stop offset="100%" stop-color="#008833"/>
    </linearGradient>
    <linearGradient id="flame-green" x1="32" y1="48" x2="32" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#55ff99"/>
      <stop offset="100%" stop-color="#006622" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Flame Thrust -->
  <path d="M26 50 C26 60, 32 64, 32 64 C32 64, 38 60, 38 50 Z" fill="url(#flame-green)"/>
  <!-- Wings -->
  <path d="M12 44 L4 54 L18 50 L24 40 Z" fill="#008833" stroke="#00ff88" stroke-width="1.5"/>
  <path d="M52 44 L60 54 L46 50 L40 40 Z" fill="#008833" stroke="#00ff88" stroke-width="1.5"/>
  <!-- Main Hull -->
  <path d="M32 4 C24 16, 18 34, 20 50 L44 50 C46 34, 40 16, 32 4 Z" fill="url(#hull-green)" stroke="#00ff88" stroke-width="1.5" filter="url(#glow-green)"/>
  <!-- Cockpit Glass -->
  <ellipse cx="32" cy="24" rx="5" ry="9" fill="#031e0b" stroke="#a0ffb0" stroke-width="1.5"/>
  <ellipse cx="30.5" cy="21" rx="2" ry="4" fill="#ffffff" opacity="0.7"/>
  <!-- Details -->
  <line x1="32" y1="36" x2="32" y2="48" stroke="#a0ffb0" stroke-width="1.5" stroke-linecap="round"/>
</svg>
